<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Hollow cups with CSG (robust)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #202025;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>

    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "csg": "https://cdn.jsdelivr.net/gh/looeee/threejs-csg@main/src/CSG/CSG.js"
          }
        }
    </script>
</head>
<body>
    <script type="module">

        import * as THREE from "three";
        import { CSG } from "csg"; 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111216);

        const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 1000);
        camera.position.set(0, 24, 70);
        camera.lookAt(0, 12, 0);


        scene.add(new THREE.AmbientLight(0xffffff, 0.3));

        const mainLight = new THREE.DirectionalLight(0xffffff, 1.4);
        mainLight.position.set(40, 80, 60);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.set(1024, 1024);
        scene.add(mainLight);

        const rim = new THREE.PointLight(0xffffff, 0.6);
        rim.position.set(-40, 20, -30);
        scene.add(rim);

        // Ground
        const ground = new THREE.Mesh(
            new THREE.BoxGeometry(300, 2, 200),
            new THREE.MeshPhongMaterial({ color: 0x8B6B3A })
        );
        ground.position.y = -1;
        ground.receiveShadow = true;
        scene.add(ground);

        // материал за стъкло
        const glassMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            roughness: 0.05,
            metalness: 0,
            transmission: 1,
            thickness: 1.2,
            ior: 1.45,
            clearcoat: 0.1,
            transparent: true,
            opacity: 1
        });

        glassMaterial.depthWrite = false;
        glassMaterial.side = THREE.DoubleSide;


        function makeHollowCups() {
            const outerR = 7;
            const innerR = 5.5;
            const height = 26;
            const bottomThickness = 3;

            const outer = new THREE.Mesh(
                new THREE.CylinderGeometry(outerR, outerR * 0.98, height, 64, 1, true),
                new THREE.MeshBasicMaterial({ color: 0xeeeeee })
            );
            outer.position.set(0, 0, 0);

            const inner = new THREE.Mesh(
                new THREE.CylinderGeometry(innerR, innerR * 0.98, height - bottomThickness, 64),
                new THREE.MeshBasicMaterial({ color: 0x222222 })
            );
            inner.position.set(0, bottomThickness / 2, 0);

            outer.updateMatrix();
            inner.updateMatrix();

            const csgObj = new CSG();
            const cupMesh = csgObj.subtract([outer, inner]).toMesh();
            cupMesh.material = glassMaterial;
            cupMesh.castShadow = true;
            cupMesh.receiveShadow = true;

            cupMesh.geometry.computeVertexNormals();

            cupMesh.geometry.computeVertexNormals();
            cupMesh.castShadow = true;
            cupMesh.receiveShadow = true;

            return cupMesh;
        }

        const cup1 = makeHollowCups();
        cup1.position.set(-18, 12, 0);
        scene.add(cup1);

        const cup2 = makeHollowCups();
        cup2.position.set(18, 12, 0);
        scene.add(cup2);

        function makeIceCube() {

            const iceMaterial = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                roughness: 0.2,
                transmission: 0.6,
                opacity: 0.9,
                transparent: true,
                depthWrite: false  
            });

            const m = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 3), iceMaterial );
            
            m.userData.relPos = new THREE.Vector3(
                (Math.random() - 0.5) * 4,  
                0.5,                          
                (Math.random() - 0.5) * 4   
            );
            return m;
        }


        const ice1 = [];
        for (let i = 0; i < 4; i++) {
            const c = makeIceCube();
            c.position.set(cup1.position.x + (Math.random() - 0.5) * 6, 10 + Math.random() * 4, (Math.random() - 0.5) * 6);
            scene.add(c);
            ice1.push(c);
        }
        const ice2 = [];
        for (let i = 0; i < 4; i++) {
            const c = makeIceCube();
            c.position.set(cup2.position.x + (Math.random() - 0.5) * 6, 10 + Math.random() * 4, (Math.random() - 0.5) * 6);
            scene.add(c);
            ice2.push(c);
        }

        
        function stepIce(ices, cup) {
            const innerR = 5.5;   
            const bottomY = 0.5;   
            const topY = 12;      

            for (const cube of ices) {
                if (!cube.userData.v) {
                    cube.userData.v = new THREE.Vector3(
                        (Math.random() - 0.5) * 0.15,  
                        (Math.random() - 0.5) * 0.01,  
                        (Math.random() - 0.5) * 0.15  
                    );
                }

                cube.userData.relPos.add(cube.userData.v);

                const rx = cube.userData.relPos.x;
                const rz = cube.userData.relPos.z;
                const dist2 = rx * rx + rz * rz;
                if (dist2 > innerR * innerR) {
                    const len = Math.sqrt(dist2); 
                    cube.userData.relPos.x *= innerR / len;
                    cube.userData.relPos.z *= innerR / len;
                    cube.userData.v.x *= -1;
                    cube.userData.v.z *= -1;
                }

                if (cube.userData.relPos.y < bottomY) {
                    cube.userData.relPos.y = bottomY;
                    cube.userData.v.y *= -1;
                } else if (cube.userData.relPos.y > topY) {
                    cube.userData.relPos.y = topY;
                    cube.userData.v.y *= -1;
                }

                cube.position.copy(cup.position).add(cube.userData.relPos);
            }
        }


                
        let tt = 0;
        function animate() { 
            tt += 0.02;
            const offset = Math.sin(tt) * 6; 

            cup1.position.x = -14 + offset;
            cup2.position.x = 14 - offset;
            
            const lean = Math.max(0, Math.sin(tt) * 0.6);
            cup1.rotation.z = -lean * 0.12;
            cup2.rotation.z = lean * 0.12;
                        
            stepIce(ice1, cup1);
            stepIce(ice2, cup2);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();

    </script>
</body>
</html>
