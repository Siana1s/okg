<!-- Updated HTML + JS with chunky C inside cube1 and chunky N above cube2 using small rotated gasket clones -->
<html>
<head>
    <style>
        body {
            margin: 0;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
                "csg": "https://cdn.jsdelivr.net/gh/looeee/threejs-csg@main/src/CSG/CSG.js"
            }
        }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from "three";
        import { CSG } from "csg";

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('lightgray');

        // Camera
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 10, 14);
        camera.lookAt(0, 0, 0);

        // Lights
        scene.add(new THREE.DirectionalLight(0xffffff, 1));
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));

        var logo = new THREE.Group();
        scene.add(logo);
        const loader = new THREE.TextureLoader();
        const textureUrl =
        {
            poster: "https://siana1s.github.io/okg/image/gumboll.png",
        }

        var palacatGeometry = new THREE.PlaneGeometry(10, 10);
        var palacatMaterial = new THREE.MeshStandardMaterial({
            map: loader.load(textureUrl.poster),
            transparent: true
        });
        var placat = new THREE.Mesh(palacatGeometry, palacatMaterial);
        placat.position.set(-5, 6.3, -3);
        scene.add(placat);

        var flange = new THREE.Mesh(
            new THREE.CylinderGeometry(2, 2, 0.1, 64),
            new THREE.MeshStandardMaterial({ color: 0xFFED29 })
        );
        var centerHole = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1, 32));

        var holes = [];
        var holeRadius = 0.2;
        var holeDistance = 1.4;
        for (let i = 0; i < 5; i++)
        {
            let angle = (i / 5) * Math.PI * 2;
            let hole = new THREE.Mesh(new THREE.CylinderGeometry(holeRadius, holeRadius, 1, 32));
            hole.position.set(Math.cos(angle) * holeDistance, 0, Math.sin(angle) * holeDistance);
            holes.push(hole);
        }

        var csg = new CSG();
        csg.subtract([flange, centerHole, ...holes]);
        var gasket = csg.toMesh();
        gasket.material = flange.material;
        gasket.rotation.x = -Math.PI / 2;


        var gasketSmall = gasket.clone();
        gasketSmall.scale.set(0.4, 0.4, 0.4);

        // Cubes
        var geo = new THREE.BoxGeometry(8, 8, 4);
        var cube1 = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: 'green' }));
        var cube2 = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: 'orange' }));

        cube1.position.x = -4;
        cube2.position.x = 4;
        logo.add(cube1);
        logo.add(cube2);

        // Groups
        var letterC = new THREE.Group();
        var letterN = new THREE.Group();
        logo.add(letterC);
        logo.add(letterN);


        function ChunkyC()
        {
            var radius = 2.28;

            for (let a = 50; a < 320; a += 20)
            {
                let clone = gasketSmall.clone();
                let rad = THREE.MathUtils.degToRad(a);
                clone.position.set(
                    Math.cos(rad) * radius,
                    Math.sin(rad) * radius,
                    0
                );
                //clone.rotation.y = -rad;
                letterC.add(clone);
            }

            letterC.position.x = (cube1.position.x) + 0.3;
            letterC.position.y = 0;
            letterC.position.z = 2.15;
        }



        function ChunkyN()
        {
            var spacing = 1.2;
            var height = 5;

            for (let i = 0; i < 5; i++)
            {
                var materaila12235 = new THREE.MeshStandardMaterial({ color: 0x3EB489 })
                gasketSmall.material = materaila12235;

                let left = gasketSmall.clone();
                left.position.set(-1.5, (i - 2) * spacing, 2.15);
                letterN.add(left);
            }

            for (let i = 0; i < 5; i++)
            {
                let right = gasketSmall.clone();
                right.position.set(1.5, (i - 2) * spacing, 2.15);
                letterN.add(right);
            }

            // Diagonal
            for (let i = 0; i < 5; i++)
            {
                let diag = gasketSmall.clone();
                let xPos = -1.5 + (i * 0.75);
                let yPos = -2 * spacing + (i * spacing);
                diag.position.set(xPos, yPos, 2.15);
                letterN.add(diag);
            }

            letterN.position.x = cube2.position.x;
            letterN.position.y = 0;
            letterN.position.z = 0;
        }

        ChunkyC();
        ChunkyN();

        window.addEventListener('resize', () =>
        {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        renderer.setAnimationLoop(() =>
        {
            renderer.render(scene, camera);
        });


        //мишка
        window.addEventListener('mousemove', onMouseMove);
        function onMouseMove(event) {
            var mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            var mouseY = -(event.clientY / window.innerHeight) * 2 + 1;

            camera.position.x = mouseX * 30;
            camera.position.z = 25 - mouseY * 15;
            camera.lookAt(0, 8, 0);
        }
    </script>
</body>
</html>
